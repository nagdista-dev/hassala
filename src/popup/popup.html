<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حصالة — مترجم وحافظ الكلمات</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true">
            <span class="logo-glyph">ع</span>
            <span class="logo-badge">A</span>
          </span>
          <div class="brand-text">
            <h1>حصالة</h1>
            <p>كلماتك مش هتتوه ✦</p>
          </div>
        </div>

        <div class="top-actions">
          <button id="settings" class="top-icon" type="button" title="الإعدادات" aria-label="الإعدادات">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h9M17 7h3M4 17h3M11 17h9" />
              <circle cx="15" cy="7" r="2.2" />
              <circle cx="9" cy="17" r="2.2" />
            </svg>
          </button>
          <span class="top-spark" aria-hidden="true">✦</span>
        </div>
      </header>

      <div class="direction" id="direction">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M4 7h15m0 0-3.2-3.2M19 7l-3.2 3.2M20 17H5m0 0 3.2-3.2M5 17l3.2 3.2"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span id="directionText">من الإنجليزي للعربي</span>
      </div>

      <div class="field">
        <textarea
          id="input"
          rows="2"
          dir="rtl"
          maxlength="200"
          placeholder="اكتب الكلمة هنا… إنجليزي أو عربي"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
        ></textarea>
        <button
          id="clear"
          class="clear-btn"
          type="button"
          title="مسح"
          aria-label="مسح الكتابة"
          hidden
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="m6 6 12 12M18 6 6 18"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <button
          id="copySource"
          class="clear-btn copy-source"
          type="button"
          title="انسخ الكلمة"
          aria-label="انسخ الكلمة"
          hidden
        >
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect
              x="9"
              y="9"
              width="11"
              height="11"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </div>

      <section class="result-card" id="resultCard" data-state="empty">
        <div class="card-top">
          <span class="eyebrow">الترجمة</span>
          <div class="card-actions">
            <span id="provider" class="provider" hidden></span>
            <button
              id="speak"
              class="copy-btn speak-btn"
              type="button"
              title="سمع الترجمة"
              aria-label="سمع الترجمة"
              hidden
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 10v4h3l4 3V7l-4 3H5Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
                <path
                  d="M15 9.5a4 4 0 0 1 0 5M17.4 7.1a7.4 7.4 0 0 1 0 9.8"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
              <span id="speakLabel">سمّعني</span>
            </button>
            <button id="copy" class="copy-btn" type="button" hidden>انسخ</button>
          </div>
        </div>
        <p id="result" class="result-text" dir="auto" aria-live="polite"></p>
      </section>

      <button
        id="saveHassala"
        class="save-btn"
        type="button"
        title="حفظ الكلمة والترجمة في حصالتك"
        hidden
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 2.6 4.4 7v10L12 21.4 19.6 17V7L12 2.6Z"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <path
            d="M12 7.2 8 9.5v5l4 2.3 4-2.3v-5l-4-2.3Z"
            fill="currentColor"
            opacity=".85"
          />
        </svg>
        <span id="saveLabel">أضف للحصالة</span>
      </button>

      <div class="file-tools">
        <button id="openFile" class="file-tool" type="button" title="افتح ملف الحفظ الحالي">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2.5h6.5A2.5 2.5 0 0 1 21 10v7.5A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5v-10Z"/>
            <path d="M8 13h6M11 10l3 3-3 3"/>
          </svg>
          <span>افتح الملف</span>
        </button>
        <button id="pathSettings" class="file-tool" type="button" title="تغيير مسار ملف الحفظ">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h9M19 18h1"/>
            <circle cx="16" cy="6" r="2.2"/>
            <circle cx="10" cy="12" r="2.2"/>
            <circle cx="16" cy="18" r="2.2"/>
          </svg>
          <span>تغيير المسار</span>
        </button>
      </div>
      <p id="fileStatus" class="file-status" role="status" aria-live="polite" hidden></p>

      <section id="historySection" class="history" hidden>
        <div class="history-top">
          <span class="eyebrow">آخر الكلمات</span>
          <button id="clearHistory" class="link-btn" type="button">مسح السجل</button>
        </div>
        <div id="history" class="chips"></div>
      </section>
    </div>

    <div id="pathModal" class="path-modal" hidden>
      <div class="path-backdrop" data-path-close></div>
      <section class="path-card" role="dialog" aria-modal="true" aria-labelledby="pathTitle">
        <header class="path-head">
          <div>
            <strong id="pathTitle">مسار ملف الحفظ</strong>
            <small>اكتب المسار الكامل من الروت</small>
          </div>
          <button id="pathClose" class="path-close" type="button" title="إغلاق" aria-label="إغلاق">×</button>
        </header>

        <label class="path-label" for="pathInput">مسار ملف الحفظ</label>
        <input
          id="pathInput"
          class="path-input"
          type="text"
          dir="ltr"
          autocomplete="off"
          spellcheck="false"
          placeholder="/home/you/Documents/Hassala Words.md"
        />
        <p id="pathDefault" class="path-default" dir="auto"></p>
        <p id="pathStatus" class="path-status" role="status" aria-live="polite"></p>

        <div class="path-actions">
          <button id="pathSave" class="path-btn primary" type="button">احفظ المسار</button>
          <button id="pathUseDefault" class="path-btn" type="button">الافتراضي</button>
          <button id="pathOpenOptions" class="path-btn ghost" type="button">كل الإعدادات</button>
        </div>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>

name: Feature request
description: A new idea or improvement for Hassala
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a feature, check
        [docs/ROADMAP.md](https://github.com/nagdista-dev/hassala/blob/main/docs/ROADMAP.md)
        — the idea may already be planned.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: The idea fits the project principles (privacy first, English-first with Arabic support, simplicity).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem does this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen exactly?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or useful links.
    validations:
      required: false

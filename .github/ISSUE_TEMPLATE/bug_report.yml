name: Bug report
description: Something is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! Fill in the details below so we can reproduce the
        issue quickly. If this is a security issue, do not post it here — use
        **Security → Report a vulnerability** instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I ran `bash scripts/check.sh` or tested the latest release.
          required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, short description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Type ...
        3. Click ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Brave
        - Edge
        - Chromium
        - Other (mention it below)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      description: From Settings or `chrome://extensions`.
      placeholder: "2.0.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / Windows 11 / macOS 15"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Load unpacked from source
        - Testers ZIP package
        - Chrome Web Store
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: native-host
    attributes:
      label: Native host status
      description: From Settings.
      options:
        - Connected
        - Not connected
        - Not installed
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: If possible, include console errors or a screenshot. Hide any personal data.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
